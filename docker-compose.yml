services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: email_agent
      POSTGRES_PASSWORD: email_agent
      POSTGRES_DB: email_task_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_agent -d email_task_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
